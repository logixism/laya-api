[project]
name = "systemone-model-api"
version = "0.1.0"
description = "Local REST API for Laya and Cloudflare Clef decision models"
readme = "README.md"
authors = [
    { name = "logix", email = "logixism@pm.me" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.0",
    "fastapi>=0.141.1",
    "huggingface-hub>=1.0",
    "laya>=0.3.3",
    "pillow>=12.0",
    "safetensors>=0.6",
    "torch>=2.11",
    "torchvision>=0.26",
    "transformers>=5.10.2",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
systemone-model-api = "systemone_model_api:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
